name: Publish to PyPI

"on":
  push:
    tags:
      - 'v*'  # Trigger on version tags (v0.20.0, v1.0.0, etc.)
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Before PyPI: a tag without its CHANGELOG.md section stops here.
      - name: Extract the changelog section of the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit} on {print}' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md" || { echo "CHANGELOG.md has no section for $version"; exit 1; }

      # Outside the checkout, so the sdist does not pick it up.
      - name: Upload the release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: release
      url: https://pypi.org/p/kajenn-orchestra
    permissions:
      id-token: write  # REQUIRED for Trusted Publisher

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write  # REQUIRED to create releases

    steps:
      - uses: actions/checkout@v4

      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Download the release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' \
            --repo='${{ github.repository }}' \
            --title='${{ github.ref_name }}' \
            --notes-file=release-notes.md \
            dist/*

  image:
    name: Publish the container image
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The wheel published to PyPI: the image holds exactly that release.
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Version of the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The kajenn image of the latest release, named by digest: the image
      # records exactly which base it holds.
      - name: Digest of the kajenn image
        id: base
        run: |
          digest=$(docker buildx imagetools inspect ghcr.io/kajenn-org/kajenn:latest \
            --format '{{json .Manifest}}' | jq -r .digest)
          case "$digest" in sha256:*) ;; *) echo "no digest for the kajenn image"; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            KAJENN_IMAGE=ghcr.io/kajenn-org/kajenn@${{ steps.base.outputs.digest }}
          labels: |
            org.opencontainers.image.base.name=ghcr.io/kajenn-org/kajenn:latest
            org.opencontainers.image.base.digest=${{ steps.base.outputs.digest }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          platforms: linux/amd64
          provenance: false
