<svg xmlns="http://www.w3.org/2000/svg" width="660" height="635" viewBox="0 0 660 635" role="img" aria-labelledby="title desc">
<title id="title">Multiworker SPA: ownership along a request</title><desc id="desc">The core routes to the SPA front, the commander selects a worker for the user, and the worker calls its hosted application. Replies return along the same path; global store is owned by the commander.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#527184"/></marker></defs>
<rect width="660" height="635" rx="16" fill="#f4f7fa"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#183042">
<text x="30" y="36" font-size="19" font-weight="700">Multiworker SPA: ownership along a request</text>
<rect x="30" y="62" width="600" height="68" rx="9" fill="#fff" stroke="#bfced8"/>
<text x="48" y="89" font-size="17" font-weight="700">Core server → SpaApplication front</text>
<text x="48" y="113" font-size="15">The front owns HTTP translation and the connection cookie.</text>
<path d="M 330 133 V 153" fill="none" stroke="#527184" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="158" width="600" height="68" rx="9" fill="#fff" stroke="#bfced8"/>
<text x="48" y="185" font-size="17" font-weight="700">Commander and group</text>
<text x="48" y="209" font-size="15">Choose the worker for the user; own placement and global indexes.</text>
<path d="M 330 229 V 249" fill="none" stroke="#527184" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="254" width="600" height="68" rx="9" fill="#fff" stroke="#bfced8"/>
<text x="48" y="281" font-size="17" font-weight="700">SpaWorker</text>
<text x="48" y="305" font-size="15">All pages of one user share this worker and the user’s store.</text>
<path d="M 330 325 V 345" fill="none" stroke="#527184" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="350" width="600" height="90" rx="9" fill="#fff" stroke="#bfced8"/>
<text x="48" y="377" font-size="17" font-weight="700">Hosted ASGI application</text>
<text x="48" y="401" font-size="15">WSGI-only sites are adapted through WsgiSeam.</text>
<text x="48" y="423" font-size="15">The hosted worker path buffers the request and response.</text>
<path d="M 330 443 V 463" fill="none" stroke="#527184" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="468" width="600" height="90" rx="9" fill="#e6f3ef" stroke="#76a99b"/>
<text x="48" y="495" font-size="17" font-weight="700">Reply returns through worker → commander → front</text>
<text x="48" y="519" font-size="15">Global store is a separate commander-owned dictionary.</text>
<text x="48" y="541" font-size="15">It is not a shared mutable Python object inside every worker.</text>
<text x="30" y="613" font-size="14">For incremental HTTP streaming or SSE, serve the route directly on the core.</text>
</g></svg>
